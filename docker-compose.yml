version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - sqlite-data:/data
    environment:
      - APP_NAME=pocket-ledger
      - APP_ENVIRONMENT=production
      - HTTP_ADDR=:8080
      - DB_PATH=/data/pocket-ledger.db
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:-change-me-in-production}
      - AUTH_ISSUER=pocket-ledger
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - FX_BASE_CURRENCY=${FX_BASE_CURRENCY:-EUR}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite-data:
