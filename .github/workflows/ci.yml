name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Validate backend scaffold builds
        working-directory: backend
        run: |
          go mod download
          go build ./...

      - name: Frontend scaffold check
        run: echo "frontend scaffold check"
